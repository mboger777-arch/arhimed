<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="АРХИМЕД">
<link rel="icon" type="image/svg+xml" href="img/icons/favicon-student.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/icons/student-32.png">
<link rel="apple-touch-icon" href="img/icons/student-apple.png">
<title>АРХИМЕД · приложение ученика</title>
<meta name="description" content="АРХИМЕД — углублённое изучение математики, русского языка, физики, химии и информатики и подготовка к олимпиадам. Уроки «объясни → реши», тренажёры и 700 задач с разбором, 1–9 класс.">
<style>
  :root { --deep:#0b1712; --panel:#13251c; --card:#182f24; --card2:#101f18;
    --brass:#d9a441; --brass-d:#a3762a; --ivory:#e8e0cc; --muted:#8fa08f;
    --amber:#d9a441;
    --glass:#7fb8a0; --glow:#7fd1ff; --danger:#e86a5a; --ok:#5f9a6a;
    --hairline:rgba(217,164,65,.25); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:Georgia,'Times New Roman',serif; color:var(--ivory); min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, #1a3226 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #132a20 0%, transparent 45%), var(--deep); }
  .wrap { max-width:900px; margin:0 auto; padding:14px 14px 140px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    border-bottom:1px solid var(--hairline); padding-bottom:10px; margin-bottom:12px; }
  .logo { font-size:20px; color:var(--brass); letter-spacing:.05em; display:flex; align-items:center; gap:10px; }
  .logo small { display:block; font-size:11.5px; color:var(--muted); letter-spacing:.02em; margin-top:2px; }
  .logo .app-mark { width:40px; height:40px; border-radius:10px; flex-shrink:0;
    box-shadow:0 4px 16px -6px rgba(217,164,65,.6); }
  .logo .logo-txt { line-height:1.15; }
  .hud { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { background:var(--panel); border:1px solid var(--hairline); border-radius:999px; padding:5px 12px; font-size:12.5px; }
  .chip b { color:var(--brass); }
  .chip.rank { color:var(--glass); border-color:rgba(127,184,160,.4); }
  /* Цель касания не меньше 44 px (правило 4 стандарта проекта): кнопка была
     72×28 px, а промах по ней выкидывает из профиля. Кегль оставлен 12 px —
     он по шкале, растёт только высота области нажатия. */
  .logout { background:none; border:1px solid rgba(232,106,90,.45); color:#e89a8f; font-family:inherit;
    font-size:12px; cursor:pointer; padding:4px 10px; transition:.15s;
    min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
  .logout:hover { background:rgba(232,106,90,.15); border-color:var(--danger); color:var(--danger); }
  .logout.hidden { display:none; }
  .nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:rgba(11,23,18,.97);
    border-top:1px solid var(--hairline); z-index:85; backdrop-filter:blur(6px);
    padding:6px 8px env(safe-area-inset-bottom,0px); max-width:900px; margin:0 auto; }
  .nav button { flex:1; background:none; border:none; color:var(--muted); font-family:inherit; font-size:10.5px;
    padding:6px 0 5px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; cursor:pointer; }
  .nav button .ic { font-size:19px; line-height:1; height:24px; width:26px; display:flex; align-items:center; justify-content:center; }
  .nav button .ic svg { width:23px; height:23px; display:block; }
  .nav button.active { color:var(--brass); }
  h2 { font-size:15px; color:var(--brass); margin:10px 2px 8px; letter-spacing:.02em; }
  .sec { font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:14px 2px 8px; }
  /* заголовки секций Книги (аккордеон) */
  .sec-head { display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:linear-gradient(170deg,var(--card),var(--card2)); border:1px solid var(--hairline);
    border-radius:12px; padding:12px 14px; cursor:pointer; font-size:15px; font-weight:bold; }
  .sec-head:hover { border-color:var(--brass); }
  .sec-head .pr2 { font-size:12.5px; color:var(--glass); font-weight:normal; display:flex; align-items:center; gap:6px; }
  .sec-head .caret { display:inline-block; font-style:normal; transition:transform .18s; color:var(--brass); }
  .sec-head .caret.down { transform:rotate(90deg); }
  /* фильтры-чипы в Банке задач */
  .chip.fb { cursor:pointer; border:1px solid var(--hairline); font-family:inherit; transition:.15s; }
  .chip.fb:hover { border-color:var(--glass); }
  .chip.fb.on { background:rgba(217,164,65,.2); border-color:var(--brass); color:var(--brass); font-weight:bold; }
  /* карточки островов */
  .island { background:linear-gradient(170deg,var(--card),var(--card2)); border:1px solid var(--hairline);
    border-radius:14px; padding:14px; margin-bottom:12px; cursor:pointer; }
  .island:hover { border-color:var(--brass); }
  .island .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .island .nm { font-size:16px; font-weight:bold; }
  .island .sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .island .pr { font-size:12px; color:var(--glass); }
  /* ===== ПУТЬ: герой, кольца, карта ===== */
  .path-hero { animation:pathIn .5s ease both; overflow:hidden; position:relative; }
  .path-hero::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 15% 120%, rgba(127,209,255,.12), transparent 55%);
    pointer-events:none; }
  .ring { flex-shrink:0; filter:drop-shadow(0 0 10px rgba(217,164,65,.35)); }
  .ring-fg { transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1); }
  .rank-badge { display:inline-block; background:linear-gradient(180deg,var(--brass),var(--brass-d)); color:#201a08;
    font-size:11px; font-weight:bold; border-radius:999px; padding:2px 10px; margin-left:6px; vertical-align:2px; }
  .spark-row { margin-top:8px; }
  .spark { opacity:0; display:inline-block; margin-right:4px; font-size:15px; animation:sparkPop .5s ease forwards; }
  .spark.done { opacity:1; }
  @keyframes sparkPop { from{transform:scale(0) rotate(-20deg); opacity:0;} to{transform:scale(1); opacity:1;} }
  .btn.pulse { animation:pulseGlow 2.2s ease-in-out infinite; }
  @keyframes pulseGlow { 0%,100%{ box-shadow:0 0 0 0 rgba(217,164,65,.45);} 50%{ box-shadow:0 0 18px 2px rgba(217,164,65,.35);} }
  .path-legend { display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,rgba(127,209,255,.1),rgba(217,164,65,.07));
    border:1px solid rgba(127,209,255,.35); border-radius:14px; padding:12px 14px; margin:12px 0 6px; cursor:pointer; }
  .path-legend:hover { border-color:var(--glow); }
  .path-island { animation:pathIn .55s ease both; position:relative; overflow:hidden; }
  .path-island::before { content:""; position:absolute; top:-40px; right:-40px; width:120px; height:120px;
    background:radial-gradient(circle, rgba(217,164,65,.12), transparent 70%); pointer-events:none; }
  @keyframes pathIn { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
  .path-island .pi-head { display:flex; align-items:center; gap:12px; }
  .path-island .pct { color:var(--brass); font-weight:bold; }
  .path-island .ring { opacity:0; animation:ringIn .4s ease .3s forwards; }
  @keyframes ringIn { from{opacity:0; transform:scale(.6);} to{opacity:1; transform:scale(1);} }
  /* ===== КОМИКС-УРОКИ ===== */
  .comic-panel { display:flex; gap:12px; align-items:stretch; }
  .comic-side { width:86px; flex-shrink:0; border-radius:14px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; padding:10px 6px; }
  .comic-ava { font-size:44px; line-height:1; animation:tcFloat 3s ease-in-out infinite; }
  .comic-name { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:center; }
  .comic-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .comic-speech { background:#f6ecd2; color:#2c2318; border-radius:4px 16px 16px 16px; padding:12px 14px;
    font-size:14.5px; line-height:1.55; box-shadow:0 4px 14px rgba(0,0,0,.25); position:relative; }
  .comic-speech::before { content:""; position:absolute; left:-8px; top:14px; border:6px solid transparent;
    border-right-color:#f6ecd2; border-left:0; }
  .comic-note { background:#1b2f24; border:1px dashed rgba(127,184,160,.5); border-radius:10px; padding:10px 12px;
    font-size:13px; line-height:1.55; color:#d9d2c0; }
  /* ===== КНИГА: табы и строки ===== */
  .btabs { display:flex; gap:8px; margin:4px 0 14px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .btab { flex:1 0 auto; min-width:92px; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:linear-gradient(170deg,var(--card),var(--card2)); border:1.5px solid var(--hairline);
    border-radius:14px; padding:10px 8px 8px; cursor:pointer; font-family:inherit; transition:.15s; }
  .btab .bt-ico { font-size:24px; line-height:1; }
  .btab .bt-name { font-size:11px; color:var(--muted); font-weight:normal; }
  .btab .bt-bar { width:100%; height:4px; border-radius:99px; background:#0d1a13; overflow:hidden; }
  .btab .bt-bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--brass-d),var(--brass)); }
  .btab.on { border-color:var(--brass); background:rgba(217,164,65,.12); box-shadow:0 0 12px rgba(217,164,65,.25); }
  .btab.on .bt-name { color:var(--brass); font-weight:bold; }
  .book-subj-head { display:flex; align-items:center; gap:12px; margin:2px 0 12px;
    background:linear-gradient(135deg,rgba(217,164,65,.1),rgba(127,209,255,.05)); border:1px solid rgba(217,164,65,.35);
    border-radius:14px; padding:12px 14px; }
  .book-subj-head .bsh-ico { font-size:30px; }
  .book-subj-head b { font-size:17px; color:var(--ivory); }
  .book-sec { margin-bottom:10px; }
  .bs-head { display:flex; align-items:center; gap:10px; background:linear-gradient(170deg,var(--card),var(--card2));
    border:1px solid var(--hairline); border-radius:12px; padding:10px 12px; cursor:pointer; }
  .bs-head:hover { border-color:var(--brass); }
  .bs-ico { font-size:22px; }
  /* значок-картинка («Путь Мишутки»): полный рост в кружке, размер от font-size родителя */
  .subj-img { width:1.15em; height:1.15em; object-fit:cover; object-position:center 28%; display:block; border-radius:50%;
    box-shadow:0 0 0 1.5px rgba(217,164,65,.4); background:#0d1a13; }
  .subj-img.lg { width:2em; height:2em; }
  .lesson-row { display:flex; align-items:center; gap:10px; padding:10px 10px 10px 14px; margin:6px 0 0;
    background:var(--panel); border:1px solid var(--hairline); border-left:3px solid var(--brass-d);
    border-radius:9px; cursor:pointer; }
  .lesson-row:hover { border-color:var(--brass); }
  .lesson-row.done { opacity:.75; border-left-color:var(--ok); }
  .lesson-row .lr-ico { font-size:18px; flex-shrink:0; }
  .lesson-row .lr-ti { flex:1; min-width:0; display:flex; flex-direction:column; }
  .lesson-row .lr-tt { font-size:14px; }
  .lesson-row .lr-td { font-size:11px; color:var(--muted); }
  .lesson-row .lr-pr { font-size:12px; color:var(--glass); flex-shrink:0; }
  .pr2 { font-size:12.5px; color:var(--glass); font-weight:normal; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .caret { display:inline-block; font-style:normal; transition:transform .18s; color:var(--brass); }
  .caret.down { transform:rotate(90deg); }
  /* ===== ТУР ===== */
  .tour-card { display:flex; align-items:center; gap:12px; background:linear-gradient(170deg,var(--card),var(--card2));
    border:1px solid var(--hairline); border-radius:14px; padding:13px 14px; margin-bottom:10px; cursor:pointer;
    position:relative; overflow:hidden; }
  .tour-card::before { content:""; position:absolute; top:-30px; right:-30px; width:100px; height:100px;
    background:radial-gradient(circle, rgba(127,209,255,.14), transparent 70%); pointer-events:none; }
  .tour-card:hover { border-color:var(--brass); }
  .tour-card .tc-icon { font-size:34px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.4)); flex-shrink:0;
    animation:tcFloat 3.4s ease-in-out infinite; }
  @keyframes tcFloat { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-3px);} }
  .tour-card .tc-name { font-size:16px; font-weight:bold; color:var(--ivory); }
  .tour-card .tc-meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .tour-card .tc-go { font-size:18px; color:var(--brass); flex-shrink:0; }
  .duel-card { border-color:rgba(232,106,90,.4); background:linear-gradient(170deg,#241a1a,#1c1414); }
  .duel-card .duel-score { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,var(--danger),#a34a3e); color:#fff; font-size:17px; font-weight:bold; box-shadow:0 0 14px rgba(232,106,90,.4); flex-shrink:0; }
  .duel-row { display:flex; gap:8px; flex-wrap:wrap; }
  .duel-btn { flex:1 1 150px; display:flex; align-items:center; gap:8px; background:#20382b; color:var(--ivory);
    border:1.5px solid #3d5c49; border-radius:10px; padding:10px 12px; font-family:inherit; font-size:13.5px; cursor:pointer; }
  .duel-btn:hover { border-color:var(--danger); color:#ffd9d3; }
  /* Строка темы внутри раскрытого острова: кегль по шкале и цель касания —
     это список, по которому ребёнок читает, что уже пройдено. На узком экране
     подпись темы не влезала в фиксированные 150 px и обрезалась. */
  .theme-row { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; min-height:32px; }
  .theme-row .tn { flex:1 1 auto; min-width:0; color:#cbb89a; }
  .theme-row .pc { flex:none; color:#8fd1a8; font-variant-numeric:tabular-nums; }
  .theme-row .bar { flex:1; height:6px; background:#0d1a13; border:1px solid var(--hairline); border-radius:99px; overflow:hidden; }
  .theme-row .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--brass-d),var(--brass)); }
  .theme-row .pc { width:44px; text-align:right; color:var(--glass); }
  /* список задач */
  .task-row { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--hairline);
    border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .task-row.done { opacity:.75; }
  .task-row .st { width:22px; text-align:center; font-size:16px; }
  .task-row .ti { flex:1; }
  .task-row .tt { font-size:14px; }
  .task-row .td { font-size:11px; color:var(--muted); }
  .task-row .lvl { font-size:11px; color:var(--glass); border:1px solid var(--hairline); border-radius:99px; padding:2px 8px; }
  /* экран задачи */
  .card { background:linear-gradient(180deg,#1c3327,#152419); border:1px solid var(--hairline);
    border-radius:12px; padding:16px; margin-bottom:12px; }
  .story { font-style:italic; color:#cbb89a; border-left:3px solid var(--brass-d); padding-left:12px;
    margin:8px 0; font-size:14px; line-height:1.55; }
  .q { font-size:16px; font-weight:bold; margin:8px 0 10px; }
  .arch { background:linear-gradient(135deg,rgba(127,209,255,.07),rgba(217,164,65,.06));
    border:1px solid rgba(127,209,255,.3); border-radius:9px; padding:10px 13px; margin:10px 0;
    color:#cfd8ea; font-size:16px; line-height:1.55; }
  /* Служебная подпись Архимеда («◈ АРХИМЕД · ПРОВЕРЬ СЕБЯ») — не меньше 14 px:
     на 10 px её не читали. При 14 px строка «◈ АРХИМЕД · РЕШИ САМ · ЗАДАЧА 1 ИЗ 3»
     занимает ~326 px, а доступно 320 px, и с прежним трекингом 2 px последняя
     цифра падала на вторую строку — поэтому трекинг 0,5 px и одна строка. */
  .arch .who { display:block; font-size:14px; letter-spacing:.5px; text-transform:uppercase; color:var(--brass); margin-bottom:3px; }
  .answer-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0; }
  input[type=number] { width:150px; font-family:Georgia,serif; font-size:19px; padding:9px 12px;
    border:2px solid var(--brass); border-radius:9px; background:#0d1a13; color:var(--ivory); outline:none; }
  /* Поле ответа в уроке/задаче — цель касания. Было 150×43 px: на 1 px ниже
     нормы 44 и заметно ниже шкалы проекта (поля и кнопки 44–52). */
  .answer-row input[type=number] { min-height:48px; }
  select { font-family:Georgia,serif; font-size:14px; padding:8px 9px; border:2px solid var(--hairline);
    border-radius:8px; background:#0d1a13; color:var(--ivory); }
  .choices { display:flex; flex-direction:column; gap:8px; }
  .choice { background:linear-gradient(180deg,#213a2c,#172b20); border:1.5px solid #3d5c49; border-radius:12px; padding:13px 15px; min-height:48px; display:flex; align-items:center;
    box-shadow:0 2px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05); transition:transform .12s ease, border-color .18s ease;
    font-family:inherit; font-size:14.5px; text-align:left; color:var(--ivory); cursor:pointer; }
  .choice.right { border-color:var(--ok); background:#1e3a26; }
  .choice.wrong { border-color:var(--danger); background:#3a211c; }
  .hints { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .hint-btn { background:linear-gradient(180deg,#1d3b2d,#12261a); color:#e9f4ec;
    border:1px solid rgba(127,184,160,.45); border-radius:12px;
    padding:10px 15px; font-family:inherit; font-size:13.5px; line-height:1.2;
    min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 2px 0 rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .12s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease; }
  .hint-btn:hover { border-color:rgba(217,164,65,.6); background:linear-gradient(180deg,#264c38,#16301f); }
  .hint-btn:active { transform:translateY(1px) scale(.99); box-shadow:0 1px 0 rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.05); }
  .hint-btn:focus-visible { outline:2px solid rgba(217,164,65,.7); outline-offset:2px; }
  .hint-btn:disabled { opacity:.45; filter:grayscale(.35); cursor:not-allowed; }
  .hint-box { background:#1b2f24; border:1px dashed var(--brass); border-radius:8px; padding:9px 12px; margin-top:8px; font-size:13.5px; color:#d9c9a8; }
  .fb { margin-top:10px; padding:10px 13px; border-radius:9px; font-size:13.5px; line-height:1.5; }
  .fb.ok { background:#1e3a26; border:1px solid var(--ok); }
  .fb.no { background:#3a211c; border:1px solid var(--danger); }
  .btn { background:linear-gradient(180deg,var(--brass),var(--brass-d)); color:#201a08; border:none; border-radius:12px;
    padding:11px 18px; font-family:inherit; font-size:14.5px; font-weight:bold; cursor:pointer;
    min-height:46px; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-align:center;
    box-shadow:0 3px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .12s ease, box-shadow .18s ease, filter .18s ease;
    position:relative; z-index:2; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  .btn:hover { filter:brightness(1.06); }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3); }
  .btn:focus-visible { outline:2px solid rgba(217,164,65,.75); outline-offset:2px; }
  .btn.ghost { background:none; color:var(--glass); border:1px solid rgba(127,184,160,.4); font-weight:normal; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btnrow { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:stretch; margin-top:12px; position:relative; z-index:80; }

  .wv-pop { animation:wvPop .38s ease both; }

  .wv-rise3 { animation:wvRise 1.3s linear .9s infinite; }

  @keyframes wvPop { 0%{transform:scale(.3);opacity:0} 70%{transform:scale(1.12);opacity:1} 100%{transform:scale(1);opacity:1} }

  @keyframes wvRise { 0%{transform:translateY(0);opacity:0} 15%{opacity:1} 100%{transform:translateY(-46px);opacity:0} }
  @keyframes wvFlow { 0%{transform:translateX(0);opacity:0} 12%{opacity:1} 88%{opacity:1} 100%{transform:translateX(96px);opacity:0} }
  @keyframes wvWave { 0%{transform:scale(.4);opacity:.9} 100%{transform:scale(1.5);opacity:0} }

@keyframes l10Dash { from{background-position-x:0} to{background-position-x:-36px} }

<!-- порядок обучения ставится ПОСЛЕ всех уроков: иначе уроки, подключённые ниже,
     не получают номера плана и падают в конец своего класса -->
<script src="data/plan_order.js?v=910"></script>
<script>
  /* сброс кэша при новой сборке: номер берём из адресов самих скриптов,
     поэтому после каждой выкладки старый кэш и старый service worker снимаются сами */
  (function(){
    try{
      var VER='0';
      document.querySelectorAll('script[src]').forEach(function(s){
        var m=/[?&]v=(\d+)/.exec(s.getAttribute('src')||'');
        if(m && +m[1] > +VER) VER=m[1];
      });
      if(VER==='0') return;
      if(localStorage.getItem('arh-build')===VER) return;
      localStorage.setItem('arh-build', VER);
      var jobs=[];
      if('caches' in window){ jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }
      if('serviceWorker' in navigator){ jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }
      Promise.all(jobs).then(function(){
        var u=new URL(location.href);
        if(u.searchParams.get('b')===VER) return;      /* второй раз не перезагружаем */
        u.searchParams.set('b', VER);
        location.replace(u.toString());
      });
    }catch(e){}
  })();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js?v=910').catch(()=>{}); });
}
window.addEventListener('hashchange', ()=>{
  try{
    const m=/^#(?:lesson-)?(\d{2,4})$/.exec(location.hash||'');
    if(m) openLessonView(+m[1]);
  }catch(e){}
});
window.addEventListener('DOMContentLoaded', ()=>{
  init(); VOICE.init();
  try{ if(typeof kidBoot==='function') kidBoot(); }catch(e){}
  try{
    /* Никакого принудительного старта с урока: приложение открывает обычный экран.
       Урок открывается только по явной ссылке вида #101 или #lesson-101. */
    const m=/^#(?:lesson-)?(\d{2,4})$/.exec(location.hash||'');
    if(m){
      if(!DB.profile){
        DB.profile={name:'Гость', klass:'8', level:'medium', color:(COLORS&&COLORS[0])||'#d9a441'};
        save(); showNav(true);
      }
      setTimeout(function(){ openLessonView(+m[1]); }, 60);
    }
  }catch(e){}
});
</script>
