<style>

  --sat:env(safe-area-inset-top,0px);

  --sar:env(safe-area-inset-right,0px);

  display:block;position:fixed;left:0;top:0;width:100%;height:100%;
  touch-action:none;outline:none;background:#2b1a3a;
}
#pre{position:fixed;left:-9999px;top:0;font:400 20px Pangolin;pointer-events:none}
